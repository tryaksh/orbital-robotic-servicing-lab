name: CI

on:
  push:
    branches: [main, 'research/**']
  pull_request:

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only project and test tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src scripts tests
      - name: Unit tests
        run: pytest
      - name: Validate baseline plan
        run: python scripts/run_experiment.py plan --task peg --epochs 2 --num-envs 64
